<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadway Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6d5dfc',
            dark: '#0f172a',
            card: '#1e293b',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b1220] text-white min-h-screen font-sans">

  <!-- Top Header -->
  <header class="flex items-center justify-between px-4 py-3 bg-[#1a2332]">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-md flex items-center justify-center text-xs font-bold">L</div>
      <span class="font-semibold text-sm">leadway</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Theme -->
      <button class="p-1.5 rounded-full hover:bg-white/10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>

      <!-- Notification -->
      <button class="relative p-1.5 rounded-full hover:bg-white/10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>

      <!-- Language -->
      <button class="flex items-center gap-1 bg-[#6d5dfc] px-3 py-1.5 rounded-lg text-sm font-medium">
        English
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <!-- Profile -->
      <button class="w-8 h-8 rounded-full bg-[#6d5dfc] flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="px-4 pt-8 pb-28">

    <!-- Wallet Card with stacked effect -->
    <div class="relative mb-8">
      <!-- Background stacked cards -->
      <div class="absolute -top-3 left-4 right-4 h-24 bg-yellow-400/80 rounded-2xl rotate-[-4deg]"></div>
      <div class="absolute -top-1.5 left-2 right-2 h-24 bg-green-400/70 rounded-2xl rotate-[3deg]"></div>

      <!-- Main purple card -->
      <div class="relative bg-[#6d5dfc] rounded-2xl p-5 shadow-xl overflow-hidden">
        <!-- Money bag watermark -->
        <div class="absolute right-6 top-1/2 -translate-y-1/2 opacity-20">
          <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C9.24 2 7 4.24 7 7v1H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2h-2V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V7c0-1.66 1.34-3 3-3zm-1 10h2v2h-2v-2zm0-4h2v2h-2v-2z"/>
          </svg>
        </div>

        <p class="text-sm opacity-90 mb-3">All Wallets in USD</p>

        <div class="flex justify-between items-start">
          <div>
            <h2 class="text-3xl font-bold tracking-tight">$100.00</h2>
            <p class="text-lg mt-1 opacity-90">$3.00</p>
          </div>
          <div class="text-right text-sm space-y-1 pt-1">
            <p>Main Wallet</p>
            <p>Profit Wallet</p>
          </div>
        </div>

        <div class="mt-5 flex items-center gap-2 text-xs opacity-80">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          You Earned 0.00 USD This Week
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-3 gap-3 mb-8">
      <!-- Deposit -->
      <button class="bg-lime-300 text-black rounded-2xl py-5 flex flex-col items-center gap-2 active:scale-95 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span class="text-sm font-semibold">Deposit</span>
      </button>

      <!-- Investment -->
      <button class="bg-violet-200 text-black rounded-2xl py-5 flex flex-col items-center gap-2 active:scale-95 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
        <span class="text-sm font-semibold">Investment</span>
      </button>

      <!-- Withdraw -->
      <button class="bg-orange-200 text-black rounded-2xl py-5 flex flex-col items-center gap-2 active:scale-95 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
        <span class="text-sm font-semibold">Withdraw</span>
      </button>
    </div>

    <!-- All Navigations -->
    <div class="bg-[#1a2332] rounded-2xl p-5">
      <h3 class="text-xs font-semibold tracking-widest text-gray-400 mb-5">ALL NAVIGATIONS</h3>

      <div class="grid grid-cols-3 gap-4 mb-6">
        <!-- Schemas -->
        <button class="flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-xl bg-[#0f172a] flex items-center justify-center relative">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-amber-500 rounded-full"></span>
          </div>
          <span class="text-xs">Schemas</span>
        </button>

        <!-- Investment -->
        <button class="flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-xl bg-[#0f172a] flex items-center justify-center relative">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-amber-500 rounded-full"></span>
          </div>
          <span class="text-xs">Investment</span>
        </button>

        <!-- Transactions -->
        <button class="flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-xl bg-[#0f172a] flex items-center justify-center relative">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-amber-500 rounded-full"></span>
          </div>
          <span class="text-xs">Transactions</span>
        </button>
      </div>

      <!-- Bottom pill navigation -->
      <div class="bg-[#6d5dfc] rounded-full py-3 px-2 flex justify-around items-center">
        <button class="flex flex-col items-center gap-1 text-white/90">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
          <span class="text-[10px]">Deposit</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-white/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span class="text-[10px]">Deposit Log</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-white/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span class="text-[10px]">Wallet Exch.</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-white/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
        </button>
        <button class="flex flex-col items-center gap-1 text-white/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </div>
  </main>

</body>
</html>
